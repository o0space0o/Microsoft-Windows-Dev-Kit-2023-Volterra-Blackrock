name: Build Validation OS Node

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-node-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Cross-compile Node for ARM64
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out reviewed build inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source, patch and installed toolchain
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          function Phase([string]$Label) {Write-Host ('Preflight phase: '+$Label+' UTC='+[DateTime]::UtcNow.ToString('o'))}
          function Read-PreflightProcess($Process,[int]$TimeoutMilliseconds) {
            $clock=[Diagnostics.Stopwatch]::StartNew();$streams=@($Process.StandardOutput.BaseStream,$Process.StandardError.BaseStream)
            $buffers=@([byte[]]::new(4096),[byte[]]::new(4096));$saved=@([IO.MemoryStream]::new(),[IO.MemoryStream]::new())
            $done=@($false,$false);$failure=$null
            try {
              $tasks=@($streams[0].ReadAsync($buffers[0],0,4096),$streams[1].ReadAsync($buffers[1],0,4096))
              while(-not($done[0]-and$done[1])) {
                if($clock.ElapsedMilliseconds-ge$TimeoutMilliseconds){$failure='deadline';break}
                for($at=0;$at-lt2;$at++){if(-not$done[$at]-and$tasks[$at].IsCompleted){$count=$tasks[$at].GetAwaiter().GetResult();if($count-eq0){$done[$at]=$true}else{if($saved[$at].Length+$count-gt1MB){$failure='stream cap';break};$saved[$at].Write($buffers[$at],0,$count);$tasks[$at]=$streams[$at].ReadAsync($buffers[$at],0,4096)}}}
                if($failure){break};if(-not($done[0]-and$done[1])){[Threading.Thread]::Sleep(10)}
              }
              if(-not$failure){$remaining=$TimeoutMilliseconds-[int]$clock.ElapsedMilliseconds;if($remaining-le0-or-not$Process.WaitForExit($remaining)){$failure='process close deadline'}}
              return [pscustomobject]@{stdout=$saved[0].ToArray();stderr=$saved[1].ToArray();failure=$failure;complete=(-not$failure);exitCode=$(if($failure){$null}else{$Process.ExitCode});elapsedMilliseconds=$clock.ElapsedMilliseconds}
            }catch{return [pscustomobject]@{stdout=$saved[0].ToArray();stderr=$saved[1].ToArray();failure='capture exception';complete=$false;exitCode=$null;elapsedMilliseconds=$clock.ElapsedMilliseconds;errorType=$_.Exception.GetType().FullName}}
            finally{$saved[0].Dispose();$saved[1].Dispose()}
          }
          function Native([string]$Exe,[string[]]$Arguments,[int]$TimeoutSeconds=120) {
            $resolved=(Get-Command $Exe -CommandType Application|Select-Object -First 1).Source
            $name=[IO.Path]::GetFileName($resolved);Write-Host ('Preflight native start: '+$name+' timeoutSeconds='+$TimeoutSeconds)
            $start=[Diagnostics.ProcessStartInfo]::new();$start.FileName=$resolved;$start.UseShellExecute=$false;$start.CreateNoWindow=$true;$start.RedirectStandardOutput=$true;$start.RedirectStandardError=$true
            foreach($argument in $Arguments){$start.ArgumentList.Add($argument)}
            $process=[Diagnostics.Process]::new();$process.StartInfo=$start;$started=$false
            try {
              if(-not$process.Start()){throw 'A fixed preflight process did not start.'};$started=$true
              $capture=Read-PreflightProcess $process ($TimeoutSeconds*1000)
              $encoding=[Text.UTF8Encoding]::new($false,$false);$stdout=$encoding.GetString($capture.stdout).TrimStart([char]0xFEFF);$stderr=$encoding.GetString($capture.stderr).TrimStart([char]0xFEFF)
              Write-Host ('Preflight native end: '+$name+' complete='+$capture.complete+' exit='+$capture.exitCode+' elapsedMilliseconds='+$capture.elapsedMilliseconds+' stdoutBytes='+$capture.stdout.Length+' stderrBytes='+$capture.stderr.Length)
              if(-not$capture.complete-or$capture.exitCode-ne0){if($stdout){Write-Host ('Captured preflight stdout: '+$stdout)};if($stderr){Write-Host ('Captured preflight stderr: '+$stderr)};throw ('A required preflight command failed: '+$name+' class='+$capture.failure+' exit='+$capture.exitCode)}
              return ($stdout+$(if($stderr){"`n"+$stderr}else{''})).TrimEnd("`r","`n")
            }finally{if($started-and-not$process.HasExited){Write-Host ('Terminating only owned preflight process tree: '+$name+' PID='+$process.Id);$process.Kill($true);if(-not$process.WaitForExit(5000)){throw 'The owned preflight process tree did not close after termination.'}};$process.Dispose()}
          }
          function Copy-BoundedDownloadStream([IO.Stream]$InputStream,[IO.Stream]$OutputStream,[long]$Maximum,[Threading.CancellationToken]$Token,[int]$TimeoutMilliseconds=180000) {
            $clock=[Diagnostics.Stopwatch]::StartNew();$buffer=[byte[]]::new(65536);$total=0L
            while($true){$left=$TimeoutMilliseconds-[int]$clock.ElapsedMilliseconds;if($left-le0){throw 'The fixed source download body exceeded its deadline.'};$read=$InputStream.ReadAsync($buffer,0,$buffer.Length,$Token);if(-not$read.Wait($left)){throw 'The fixed source download body exceeded its deadline.'};$count=$read.GetAwaiter().GetResult();if($count-eq0){break};if($total+$count-gt$Maximum){throw 'The fixed source download body exceeded its byte cap.'};$OutputStream.Write($buffer,0,$count);$total+=$count}
            return $total
          }
          function Download-FixedNodeSource([string]$Archive) {
            $handler=[Net.Http.HttpClientHandler]::new();$handler.AllowAutoRedirect=$false;$handler.UseDefaultCredentials=$false
            $client=[Net.Http.HttpClient]::new($handler);$client.Timeout=[TimeSpan]::FromSeconds(180)
            $cancel=[Threading.CancellationTokenSource]::new(180000);$response=$null;$input=$null;$output=$null;$clock=[Diagnostics.Stopwatch]::StartNew()
            try {
              $response=$client.GetAsync('https://nodejs.org/download/release/v26.10.0/node-v26.10.0.tar.xz',[Net.Http.HttpCompletionOption]::ResponseHeadersRead,$cancel.Token).GetAwaiter().GetResult()
              if([int]$response.StatusCode-ne200){throw ('The fixed source download returned HTTP '+[int]$response.StatusCode)}
              $input=$response.Content.ReadAsStreamAsync().GetAwaiter().GetResult();$output=[IO.File]::Open($Archive,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
              $left=180000-[int]$clock.ElapsedMilliseconds;if($left-le0){throw 'The fixed source download exceeded its total deadline.'}
              $bytes=Copy-BoundedDownloadStream $input $output 62055788 $cancel.Token $left;$output.Flush($true)
              Write-Host ('Source download complete: bytes='+$bytes+' elapsedMilliseconds='+$clock.ElapsedMilliseconds)
              if($bytes-ne62055788){throw 'The fixed source download length differs.'}
            }finally{$cancel.Cancel();if($output){$output.Dispose()};if($input){$input.Dispose()};if($response){$response.Dispose()};$client.Dispose();$handler.Dispose();$cancel.Dispose()}
          }
          function Hash([string]$File) {(Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash}
          function Patch-BlobArguments([string]$Repo,[string]$Commit) {
            if(-not$Repo-or$Commit-cnotmatch'^[a-f0-9]{40}$'){throw 'One fixed repository and exact workflow commit are required.'}
            return @('-C',$Repo,'cat-file','blob',($Commit+':patches/node-v26.10.0-validationos.patch'))
          }
          function Read-PatchBlobOutput($Process,[int]$TimeoutMilliseconds=30000) {
            $clock=[Diagnostics.Stopwatch]::StartNew()
            $streams=@($Process.StandardOutput.BaseStream,$Process.StandardError.BaseStream)
            $caps=@(65536,4096);$buffers=@([byte[]]::new(4096),[byte[]]::new(4096))
            $saved=@([IO.MemoryStream]::new(),[IO.MemoryStream]::new())
            $tasks=@($streams[0].ReadAsync($buffers[0],0,4096),$streams[1].ReadAsync($buffers[1],0,4096));$done=@($false,$false)
            try {
              while(-not($done[0]-and$done[1])) {
                if($clock.ElapsedMilliseconds-ge$TimeoutMilliseconds){throw 'The fixed committed-blob reader exceeded its deadline.'}
                for($at=0;$at-lt2;$at++) {
                  if(-not$done[$at]-and$tasks[$at].IsCompleted) {
                    $count=$tasks[$at].GetAwaiter().GetResult()
                    if($count-eq0){$done[$at]=$true}
                    else {
                      if($saved[$at].Length+$count-gt$caps[$at]){throw 'The fixed committed-blob stream exceeded its cap.'}
                      $saved[$at].Write($buffers[$at],0,$count)
                      $tasks[$at]=$streams[$at].ReadAsync($buffers[$at],0,4096)
                    }
                  }
                }
                if(-not($done[0]-and$done[1])){[Threading.Thread]::Sleep(10)}
              }
              $remaining=$TimeoutMilliseconds-[int]$clock.ElapsedMilliseconds
              if($remaining-le0-or-not$Process.WaitForExit($remaining)){throw 'The fixed committed-blob process did not close.'}
              return [pscustomobject]@{bytes=$saved[0].ToArray();stderrBytes=$saved[1].Length;exitCode=$Process.ExitCode}
            }finally{$saved[0].Dispose();$saved[1].Dispose()}
          }
          function Assert-PatchBlob($Observed) {
            if($Observed.exitCode-ne0-or$Observed.stderrBytes-ne0){throw ('The fixed committed-blob query failed: exit='+$Observed.exitCode+' stderrBytes='+$Observed.stderrBytes)}
            $sha=[Security.Cryptography.SHA256]::Create()
            try{$actualHash=([BitConverter]::ToString($sha.ComputeHash($Observed.bytes))).Replace('-','')}finally{$sha.Dispose()}
            if($Observed.bytes.Length-ne9940-or$actualHash-cne'E7AC4A086B6AA359BD6A17FDD14878E7CAD074D1B828A18D15A96C41F3F1CBF6'){throw ('Committed patch differs: bytes='+$Observed.bytes.Length+' SHA256='+$actualHash)}
            return ,$Observed.bytes
          }
          function Read-ExactPatchBlob([string]$Git,[string]$Repo,[string]$Commit) {
            $start=[Diagnostics.ProcessStartInfo]::new();$start.FileName=$Git;$start.UseShellExecute=$false;$start.CreateNoWindow=$true
            $start.RedirectStandardOutput=$true;$start.RedirectStandardError=$true
            foreach($argument in (Patch-BlobArguments $Repo $Commit)){$start.ArgumentList.Add($argument)}
            $process=[Diagnostics.Process]::new();$process.StartInfo=$start;$started=$false
            try {
              if(-not$process.Start()){throw 'The fixed committed-blob process did not start.'};$started=$true
              $observed=Read-PatchBlobOutput $process
              return ,(Assert-PatchBlob $observed)
            }finally{if($started-and-not$process.HasExited){$process.Kill();$process.WaitForExit(5000)|Out-Null};$process.Dispose()}
          }
          $repo=$env:GITHUB_WORKSPACE
          $patch=Join-Path $repo 'patches/node-v26.10.0-validationos.patch'
          Phase 'Raw committed patch start'
          # Read raw committed bytes; a text pipeline or checkout can alter newlines.
          $git=(Get-Command git -CommandType Application|Select-Object -First 1).Source
          $patchBytes=Read-ExactPatchBlob $git $repo $env:GITHUB_SHA
          $patchLeaf=Get-Item -LiteralPath $patch -Force
          if($patchLeaf.PSIsContainer-or$patchLeaf.LinkType-or($patchLeaf.Attributes-band[IO.FileAttributes]::ReparsePoint)){throw 'The checked-out patch destination must be an ordinary file.'}
          [IO.File]::WriteAllBytes($patch,$patchBytes)
          if((Get-Item -LiteralPath $patch).Length-ne9940-or(Hash $patch)-cne'E7AC4A086B6AA359BD6A17FDD14878E7CAD074D1B828A18D15A96C41F3F1CBF6'){throw 'The exact reviewed seven-file patch differs.'}
          Phase 'Raw committed patch verified'
          Phase 'Tool discovery start'
          $manifestPath=Join-Path $repo 'patches/node-v26.10.0-validationos.json'
          if((Get-Item -LiteralPath $manifestPath).Length-gt65536){throw 'Build-input manifest exceeds its bound.'}
          $manifest=Get-Content -LiteralPath $manifestPath -Raw|ConvertFrom-Json
          if($manifest.version-ne1-or$manifest.kind-cne'reviewedNodeValidationOsBuildInputs'-or$manifest.tag-cne'v26.10.0'-or$manifest.upstreamCommit-cne'151845ab90d3926ceb36eedf1eade09619c3adc9'-or$manifest.sourceSHA256-cne'7B3A546D33CB7E15A43BDD7A57E0BE5D5FD5FFC553E6E4C120033E66F0BA20C5'-or$manifest.sourceBytes-ne62055788-or$manifest.patchSHA256-cne'E7AC4A086B6AA359BD6A17FDD14878E7CAD074D1B828A18D15A96C41F3F1CBF6'-or@($manifest.modifiedFiles).Count-ne7){throw 'The fixed upstream and patch manifest differ.'}
          $expected=@('deps/uv/src/win/util.c','deps/uv/src/win/process.c','deps/uv/src/win/winapi.c','deps/uv/src/win/winapi.h','deps/uv/uv.gyp','deps/cares/src/lib/util/ares_rand.c','deps/cares/cares.gyp')
          if((@($manifest.modifiedFiles.relative)-join'|')-cne($expected-join'|')){throw 'The exact seven patch paths differ.'}
          foreach($row in $manifest.modifiedFiles){if($row.beforeSHA256-cnotmatch'^[A-F0-9]{64}$'-or$row.afterSHA256-cnotmatch'^[A-F0-9]{64}$'-or$row.afterBytes-lt1){throw 'Patch file hashes or byte bounds differ.'}}
          if($env:PROCESSOR_ARCHITECTURE-cne'AMD64'){throw 'The supported x64 cross-build host is required.'}
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $required=@('Microsoft.VisualStudio.Component.VC.Tools.ARM64','Microsoft.VisualStudio.Component.VC.ATL.ARM64','Microsoft.VisualStudio.Component.VC.Llvm.Clang','Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset','Microsoft.Component.MSBuild')
          $vsJson=Native $vswhere (@('-products','*','-latest','-version','[17.14,18.0)','-requires')+$required+@('-format','json','-utf8'))
          $instances=@($vsJson|ConvertFrom-Json)
          if($instances.Count-ne1-or[version]$instances[0].installationVersion-lt[version]'17.14'-or[version]$instances[0].installationVersion-ge[version]'18.0'){throw 'One installed VS2022 17.14+ instance with the required components is required.'}
          $vs=$instances[0].installationPath
          $clang=Join-Path $vs 'VC/Tools/Llvm/x64/bin/clang-cl.exe'
          $msbuild=Join-Path $vs 'MSBuild/Current/Bin/amd64/MSBuild.exe'
          $vcvars=Join-Path $vs 'VC/Auxiliary/Build/vcvarsall.bat'
          foreach($file in @($clang,$msbuild,$vcvars)){if(-not[IO.File]::Exists($file)){throw 'A required installed Visual Studio tool is missing.'}}
          $clangText=Native $clang @('--version')
          $match=[regex]::Match($clangText,'clang version ([0-9]+\.[0-9]+\.[0-9]+)')
          if(-not$match.Success-or[version]$match.Groups[1].Value-lt[version]'19.0.0'){throw 'Visual Studio supplied Clang19+ is required.'}
          $vcVersions=@(Get-ChildItem -LiteralPath (Join-Path $vs 'VC/Tools/MSVC') -Directory|Sort-Object {[version]$_.Name} -Descending)
          $vc=@($vcVersions|Where-Object{[IO.File]::Exists((Join-Path $_.FullName 'bin/Hostx64/arm64/cl.exe'))-and[IO.File]::Exists((Join-Path $_.FullName 'atlmfc/include/atlbase.h'))-and[IO.File]::Exists((Join-Path $_.FullName 'atlmfc/lib/arm64/atls.lib'))}|Select-Object -First 1)
          if($vc.Count-ne1){throw 'Installed MSVC ARM64 and ATL files are required.'}
          $sdkVersion='10.0.26100.0'
          $sdk=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          $sdkFiles=@(('Include/'+$sdkVersion+'/shared/bcrypt.h');('Include/'+$sdkVersion+'/um/apiquery2.h');('Lib/'+$sdkVersion+'/um/arm64/bcrypt.lib');('Lib/'+$sdkVersion+'/um/arm64/OneCore_apiset.lib');('Lib/'+$sdkVersion+'/ucrt/arm64/ucrt.lib'))
          foreach($relative in $sdkFiles){if(-not[IO.File]::Exists((Join-Path $sdk $relative))){throw ('The actual Windows SDK26100 ARM64 header/library is missing: '+$relative)}}
          $rustc=(Get-Command rustc -CommandType Application|Select-Object -First 1).Source
          $rustup=(Get-Command rustup -CommandType Application|Select-Object -First 1).Source
          $rustText=Native $rustc @('--version')
          $match=[regex]::Match($rustText,'^rustc ([0-9]+\.[0-9]+\.[0-9]+)')
          if(-not$match.Success-or[version]$match.Groups[1].Value-lt[version]'1.86.0'){throw 'Rust1.86+ is required for enabled Temporal.'}
          Phase 'Rust target verification start'
          $rustToolchain=(Native $rustup @('show','active-toolchain')).Split(' ')[0]
          if($rustToolchain-notmatch'^[A-Za-z0-9_.-]+$'){throw 'Unexpected active Rust toolchain spelling.'}
          $targets=(Native $rustup @('target','list','--installed','--toolchain',$rustToolchain))-split'\r?\n'
          $rustTargetAdded=$false
          if($targets-cnotcontains'aarch64-pc-windows-msvc'){
            # Only this standard-library target is acquired on the disposable CI worker.
            Phase 'Rust target acquisition start'
            $null=Native $rustup @('target','add','aarch64-pc-windows-msvc','--toolchain',$rustToolchain) -TimeoutSeconds 600
            Phase 'Rust target acquisition closed'
            $rustTargetAdded=$true
            $targets=(Native $rustup @('target','list','--installed','--toolchain',$rustToolchain))-split'\r?\n'
          }
          if($targets-cnotcontains'aarch64-pc-windows-msvc'){throw 'Rust ARM64 target is unavailable.'}
          Phase 'Rust target verified'
          $python=(Get-Command python -CommandType Application|Select-Object -First 1).Source
          $pythonText=Native $python @('--version')
          $match=[regex]::Match($pythonText,'^Python ([0-9]+\.[0-9]+\.[0-9]+)')
          if(-not$match.Success-or[version]$match.Groups[1].Value-lt[version]'3.10.0'-or[version]$match.Groups[1].Value-ge[version]'4.0.0'){throw 'A supported installed Python3.10+ is required.'}
          Phase 'Tool discovery complete'
          $work=Join-Path $env:RUNNER_TEMP ('validation-node-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $work){throw 'The build scope must be fresh.'}
          $null=New-Item -ItemType Directory -Path $work
          $artifact=Join-Path $work 'artifact';$null=New-Item -ItemType Directory -Path $artifact
          $archive=Join-Path $work 'node-v26.10.0.tar.xz'
          Phase 'Source download start'
          Download-FixedNodeSource $archive
          if((Get-Item -LiteralPath $archive).Length-ne62055788-or(Hash $archive)-cne'7B3A546D33CB7E15A43BDD7A57E0BE5D5FD5FFC553E6E4C120033E66F0BA20C5'){throw 'The official Node26.10 archive differs.'}
          Phase 'Source download verified'
          Phase 'Source extraction start'
          $extractorBody=@'
          """Fixed Node release source extraction; no archive metadata restoration."""
          import hashlib
          import json
          import lzma
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import tarfile
          import time

          EXPECTED = (62055788, "7B3A546D33CB7E15A43BDD7A57E0BE5D5FD5FFC553E6E4C120033E66F0BA20C5", 37977, 4205, 674699160)
          SOURCE_FOLDER = "node-v26.10.0"
          REPARSE = getattr(stat, "FILE_ATTRIBUTE_REPARSE_POINT", 1024)
          BUFFER = 65536

          def identity(info):
              return (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns, info.st_nlink)

          def ordinary(path, directory):
              info = os.lstat(path)
              if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & REPARSE:
                  raise ValueError("redirected path")
              if (directory and not stat.S_ISDIR(info.st_mode)) or (not directory and (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1)):
                  raise ValueError("nonordinary path")
              if os.path.normcase(os.path.abspath(path)) != os.path.normcase(os.path.realpath(path)):
                  raise ValueError("aliased path")
              return info

          def ancestry(path):
              target = Path(path)
              for current in reversed((target, *target.parents)):
                  ordinary(current, True)

          def digest(stream):
              stream.seek(0)
              value = hashlib.sha256()
              while True:
                  data = stream.read(BUFFER)
                  if not data:
                      break
                  value.update(data)
              stream.seek(0)
              return value.hexdigest().upper()

          def member_path(member):
              name = member.name
              if member.isdir() and name.endswith("/"):
                  name = name[:-1]
              if not name or len(name) > 4096 or re.search(r'[\x00-\x1f\x7f\\:<>"|?*]', name):
                  raise ValueError("unsafe member path")
              parts = name.split("/")
              if parts[0] != SOURCE_FOLDER or any(not part or part in (".", "..") or part.rstrip(" .") != part for part in parts):
                  raise ValueError("member escaped source folder")
              if any(re.fullmatch(r"(?:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:\..*)?", part, re.I) for part in parts):
                  raise ValueError("reserved member path")
              if member.type not in (tarfile.REGTYPE, tarfile.AREGTYPE, tarfile.DIRTYPE) or member.sparse is not None:
                  raise ValueError("links devices sparse or special members refused")
              if type(member.size) is not int or member.size < 0 or (member.isdir() and member.size != 0):
                  raise ValueError("invalid member size")
              return parts

          def extract_stream(stream, destination, expected, progress=None):
              expected_size, expected_sha, expected_files, expected_dirs, expected_bytes = expected
              before = os.fstat(stream.fileno())
              if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size != expected_size or digest(stream) != expected_sha:
                  raise ValueError("fixed source archive differs")
              destination = Path(destination)
              ancestry(destination)
              root = destination / SOURCE_FOLDER
              if os.path.lexists(root):
                  raise ValueError("source folder must be fresh")
              os.mkdir(root)
              directories = {(): ordinary(root, True)}
              names = set()
              directory_members = set()
              files = total = count = 0
              manifest = hashlib.sha256()

              def parents(parts):
                  ancestry(destination)
                  for index in range(len(parts) + 1):
                      key = tuple(parts[:index])
                      current = root.joinpath(*key)
                      if key not in directories:
                          os.mkdir(current)
                          directories[key] = ordinary(current, True)
                      now = ordinary(current, True)
                      previous = directories[key]
                      if (now.st_dev, now.st_ino) != (previous.st_dev, previous.st_ino):
                          raise ValueError("source parent identity changed")

              with tarfile.open(fileobj=stream, mode="r|xz") as archive:
                  for member in archive:
                      parts = member_path(member)
                      relative = parts[1:]
                      name = "/".join(parts)
                      folded = name.casefold()
                      if folded in names:
                          raise ValueError("duplicate or case-colliding archive path")
                      names.add(folded)
                      count += 1
                      if count > expected_files + expected_dirs:
                          raise ValueError("source member count exceeds fixed closure")
                      if member.isdir():
                          parents(relative)
                          directory_members.add(tuple(relative))
                          if len(directory_members) > expected_dirs:
                              raise ValueError("source directory count exceeds fixed closure")
                          continue
                      if not relative:
                          raise ValueError("source root cannot be a file")
                      files += 1
                      total += member.size
                      if files > expected_files or total > expected_bytes:
                          raise ValueError("source file count or bytes exceed fixed closure")
                      parents(relative[:-1])
                      target = root.joinpath(*relative)
                      flags = os.O_RDWR | os.O_CREAT | os.O_EXCL | getattr(os, "O_BINARY", 0) | getattr(os, "O_NOFOLLOW", 0)
                      descriptor = os.open(target, flags, 0o600)
                      content = archive.extractfile(member)
                      if content is None:
                          os.close(descriptor)
                          raise ValueError("regular archive member has no bytes")
                      file_hash = hashlib.sha256()
                      with os.fdopen(descriptor, "w+b") as output, content:
                          remaining = member.size
                          while remaining:
                              data = content.read(min(BUFFER, remaining))
                              if not data:
                                  raise ValueError("source member ended early")
                              if output.write(data) != len(data):
                                  raise ValueError("source leaf write ended early")
                              file_hash.update(data)
                              remaining -= len(data)
                          if content.read(1):
                              raise ValueError("source member exceeds declared size")
                          output.flush()
                          if digest(output) != file_hash.hexdigest().upper():
                              raise ValueError("created source bytes differ from archive member")
                          held = os.fstat(output.fileno())
                          named = ordinary(target, False)
                          if held.st_size != member.size or identity(held) != identity(named):
                              raise ValueError("created source leaf identity differs")
                      parents(relative[:-1])
                      encoded = name.encode("utf-8")
                      manifest.update(len(encoded).to_bytes(4, "little") + encoded + member.size.to_bytes(8, "little") + file_hash.digest())
                      if progress and count % 2000 == 0:
                          progress(count, files, total)
              if (files, len(directory_members), total) != (expected_files, expected_dirs, expected_bytes) or set(directories) != directory_members:
                  raise ValueError("complete source closure differs")
