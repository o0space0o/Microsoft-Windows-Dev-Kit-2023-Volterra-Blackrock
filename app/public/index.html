<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="volterra-session" content="SESSION_TOKEN">
  <title>Microsoft Volterra</title><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="universe" aria-label="Microsoft Volterra workspace">
    <img id="artwork" src="/design/desktop.png" alt="Approved Microsoft Volterra space-themed desktop reference">
    <nav id="portals" aria-label="Workspace navigation"></nav>
    <aside id="workspace" class="hidden" aria-label="Live workspace">
      <div class="panel-heading"><span id="live-indicator" aria-hidden="true"></span><div><span class="eyebrow">Microsoft Volterra · Live workspace</span><h1 id="panel-title">Connecting to Codex</h1></div></div>
      <div id="status" role="status"></div>
      <div id="automation-status" role="status"></div>
      <div id="activity-clock" aria-live="off"></div>
      <div id="restart" class="hidden" role="status"></div>
      <div id="journal" role="log" aria-label="Live agent messages and terminal output" tabindex="0"></div>
      <div id="requests" class="hidden" aria-live="polite"></div>
      <form id="composer"><label class="sr-only" for="message">Message to Codex</label><textarea id="message" rows="2" placeholder="Talk to Codex while it works…"></textarea><button class="orb" type="submit" aria-label="Send message">↗</button></form>
      <p class="footnote">Work is saved automatically. Questions appear here when your answer is needed.</p>
    </aside>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
